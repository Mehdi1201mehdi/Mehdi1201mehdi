<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<!-- CSP : 'self' par défaut. Les hôtes jsdelivr / huggingface ne servent QUE le
     mode « Coach IA » facultatif (Transformers.js), désactivé par défaut : rien
     n'est chargé depuis ces domaines tant que l'utilisateur ne l'active pas.
     'wasm-unsafe-eval' + worker blob: sont requis par le moteur ONNX. -->
<!-- connect-src : les trois fournisseurs du coach IA (appel direct avec la clé de
     l'utilisateur) et les relais Cloudflare Workers (*.workers.dev, + le relais
     local de développement). Un relais sur un domaine personnalisé doit être
     ajouté ici, sinon le navigateur bloque la connexion. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self'; worker-src 'self' blob:; img-src 'self' data: blob: https://raw.githubusercontent.com https://wger.de https://*.cloudfront.net https://oss.exercisedb.dev; media-src 'self' https://raw.githubusercontent.com https://wger.de https://*.cloudfront.net; connect-src 'self' https://world.openfoodfacts.org https://oss.exercisedb.dev https://exercisedb.p.rapidapi.com https://cdn.jsdelivr.net https://huggingface.co https://*.hf.co https://cdn-lfs.huggingface.co https://cdn-lfs-us-1.hf.co https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com https://*.workers.dev http://localhost:8787">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- NOM DE L'APPLICATION : lu par le navigateur AVANT tout script, donc écrit
     ici en dur. Source de vérité : src/config/identite.js — si tu changes le nom
     là-bas, change-le aussi sur cette ligne et sur le <title> plus bas. -->
<meta name="apple-mobile-web-app-title" content="Coach Perso">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://raw.githubusercontent.com">
<link rel="dns-prefetch" href="https://raw.githubusercontent.com">
<link rel="preconnect" href="https://wger.de">
<link rel="dns-prefetch" href="https://wger.de">
<link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<!-- Anton porte les titres : sans préchargement, ils s'affichent d'abord en
     Inter puis basculent, ce qui fait sauter la mise en page au démarrage. -->
<link rel="preload" href="assets/fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<!-- Doit refléter `titreComplet()` de src/config/identite.js (voir plus haut). -->
<title>Coach Perso — Musculation</title>
</head>
<body>
<!-- Lumière d'ambiance : trois masses très diffuses qui dérivent lentement
     derrière toute l'application. C'est ce qui distingue une vraie surface d'un
     aplat CSS. Purement décoratif, sous le contenu, sans interception du tactile,
     et entièrement coupé sous `prefers-reduced-motion`. -->
<div id="aurore" aria-hidden="true"><i></i><i></i><i></i></div>
<a href="#view" class="skip-link">Aller au contenu</a>
<div id="splash">
  <div class="sp-logo"><img src="assets/icons/icon.svg" alt=""></div>
  <!-- Remplacés au chargement depuis src/config/identite.js. -->
  <div class="sp-name">COACH&nbsp;PERSO</div>
  <div class="sp-tag">Ton entraînement, tes données, hors ligne.</div>
</div>
<header class="top"><div class="wrap">
  <div class="brand" id="brand">
    <span class="logo" id="hdLogo" aria-hidden="true"></span>
    <!-- Remplis au chargement depuis src/config/identite.js ; les valeurs écrites
         ici évitent un en-tête vide le temps que le module se charge. -->
    <div><div class="eyebrow" id="hdEyebrow">Musculation</div><b id="hdTitle">Coach Perso</b></div>
  </div>
  <button id="themeBtn" class="chip" aria-label="Changer de thème"></button>
</div></header>

<main class="wrap" id="view" role="main"></main>

<nav class="tabs" id="tabs" hidden><div class="wrap">
  <span class="tab-pill" id="tabPill" aria-hidden="true"></span>
  <button data-tab="prog" aria-label="Routines"><span class="tb-i"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4.5"/><path d="M7.5 8.5h.01M7.5 12h.01M7.5 15.5h.01M11 8.5h5.5M11 12h5.5M11 15.5h5.5"/></svg></span>Routines</button>
  <button data-tab="cat" aria-label="Exercices"><span class="tb-i"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="14.2" cy="4.3" r="1.9"/><path d="M14.6 8.3 11 10.6l1.9 3.4L10.1 20"/><path d="M12.9 14l4.3 1.7"/><path d="M11 10.6 6.4 9.1"/></svg></span>Exercices</button>
  <button data-tab="dash" aria-label="Séance"><span class="tb-i"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8v8M7 6v12M17 6v12M20 8v8M7 12h10"/></svg></span>Séance</button>
  <button data-tab="recup" aria-label="Récupération"><span class="tb-i"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.4 12a8.4 8.4 0 1 1-2.46-5.94"/><path d="M20.6 3.6V9.1h-5.5"/><path d="M12 9.4v5.2M9.4 12h5.2"/></svg></span>Récupération</button>
  <button data-tab="set" aria-label="Compte"><span class="tb-i"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.6 18.6a6.6 6.6 0 0 1 10.8 0"/></svg></span>Compte</button>
</div></nav>

<!-- Bouton flottant de l'assistant. Présent sur les cinq onglets, posé au-dessus
     de la barre, comme chez FitAI. Masqué pendant une séance active : à ce
     moment-là, le pouce ne doit rencontrer que « Enregistrer la série ». -->
<button id="fabCoach" hidden aria-label="Poser une question au coach">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M20.6 11.4a8.2 8.2 0 0 1-8.8 8.2 9.4 9.4 0 0 1-2.8-.4L4.2 20.7l1.4-4.1a8 8 0 0 1-1.8-5.2A8.2 8.2 0 0 1 12.2 3a8.2 8.2 0 0 1 8.4 8.4z"/>
    <path d="M11.6 7.3 12.5 9.6l2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9z" fill="currentColor" stroke="none"/>
    <path d="M16.2 12.6l.4 1 1 .4-1 .4-.4 1-.4-1-1-.4 1-.4z" fill="currentColor" stroke="none"/>
  </svg>
</button>

<div id="overlay" role="dialog" aria-label="Minuteur de repos">
  <div class="ovhead"><span class="eyebrow">Récupération</span><h2 style="margin:3px 0 0;font-size:1.7rem">Repos</h2></div>
  <div class="ring">
    <svg viewBox="0 0 230 230"><circle cx="115" cy="115" r="104" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
      <circle id="ringFg" cx="115" cy="115" r="104" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="653" stroke-dashoffset="0"/></svg>
    <div class="t num" id="ovTxt">1:30</div>
  </div>
  <div class="ovsub muted small" id="ovSub"></div>
  <span id="ovAnnonce" class="sr-only" aria-live="assertive"></span>
  <div class="row" style="justify-content:center">
    <button class="chip" id="ovMinus">−15 SEC</button>
    <button class="chip" id="ovPlus">+15 SEC</button>
  </div>
  <button class="primary big" id="ovSkip" style="max-width:300px">Passer le repos</button>
</div>

<script type="module" src="src/ui/app.js"></script>
<script src="boot.js"></script>
</body>
</html>
