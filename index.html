<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Coach Perso — 12 semaines</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="wrap">
  <div>
    <div class="eyebrow">Programme personnel · 12 semaines</div>
    <h1 id="hTitle">Coach Perso</h1>
  </div>
  <button id="themeBtn" class="chip" title="Basculer clair/sombre">◐</button>
</div></header>
<main class="wrap" id="view"></main>
<nav class="tabs"><div class="wrap">
  <button data-tab="dash"><span class="ico">▦</span>Accueil</button>
  <button data-tab="prog"><span class="ico">🗓</span>Programme</button>
  <button data-tab="train"><span class="ico">🏋</span>Séance</button>
  <button data-tab="food"><span class="ico">🍽</span>Nutrition</button>
  <button data-tab="track"><span class="ico">📈</span>Suivi</button>
  <button data-tab="set"><span class="ico">⚙</span>Réglages</button>
</div></nav>
<div id="timerOverlay" role="dialog" aria-label="Minuteur de repos">
  <div class="eyebrow">Repos</div>
  <div class="ring">
    <svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="100" fill="none" stroke="var(--line)" stroke-width="10"/><circle id="ringFg" cx="110" cy="110" r="100" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="628" stroke-dashoffset="0"/></svg>
    <div class="t num" id="timerTxt">2:00</div>
  </div>
  <div class="row">
    <button class="chip" id="timerMinus">−30 s</button>
    <button class="chip" id="timerPlus">+30 s</button>
    <button class="primary" id="timerSkip">Reprendre maintenant</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
