<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<!-- CSP : 'self' par défaut. Les hôtes jsdelivr / huggingface ne servent QUE le
     mode « Coach IA » facultatif (Transformers.js), désactivé par défaut : rien
     n'est chargé depuis ces domaines tant que l'utilisateur ne l'active pas.
     'wasm-unsafe-eval' + worker blob: sont requis par le moteur ONNX. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self'; worker-src 'self' blob:; img-src 'self' data: blob: https://raw.githubusercontent.com https://wger.de https://*.cloudfront.net https://oss.exercisedb.dev; media-src 'self' https://raw.githubusercontent.com https://wger.de https://*.cloudfront.net; connect-src 'self' https://world.openfoodfacts.org https://oss.exercisedb.dev https://exercisedb.p.rapidapi.com https://cdn.jsdelivr.net https://huggingface.co https://*.hf.co https://cdn-lfs.huggingface.co https://cdn-lfs-us-1.hf.co">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach Perso">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://raw.githubusercontent.com">
<link rel="dns-prefetch" href="https://raw.githubusercontent.com">
<link rel="preconnect" href="https://wger.de">
<link rel="dns-prefetch" href="https://wger.de">
<link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<title>Coach Perso — Musculation</title>
</head>
<body>
<a href="#view" class="skip-link">Aller au contenu</a>
<div id="splash">
  <div class="sp-logo"><img src="assets/icons/icon.svg" alt=""></div>
  <div class="sp-name">COACH&nbsp;PERSO</div>
  <div class="sp-tag">Devenez la meilleure version de vous-même</div>
</div>
<header class="top"><div class="wrap">
  <div class="brand" id="brand">
    <img class="logo" src="assets/icons/icon.svg" alt="">
    <div><div class="eyebrow" id="hdEyebrow">Musculation</div><b id="hdTitle">Coach Perso</b></div>
  </div>
  <button id="themeBtn" class="chip" aria-label="Changer de thème">◐</button>
</div></header>

<main class="wrap" id="view" role="main"></main>

<nav class="tabs" id="tabs" hidden><div class="wrap">
  <button data-tab="dash" aria-label="Accueil"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Accueil</button>
  <button data-tab="prog" aria-label="Programme"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>Programme</button>
  <button data-tab="train" aria-label="Séance"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8v8M7 6v12M17 6v12M20 8v8M7 12h10"/></svg>Séance</button>
  <button data-tab="stats" aria-label="Progrès"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V4M4 20h16"/><path d="M7 15l3-3 3 2 4-6"/></svg>Progrès</button>
  <button data-tab="set" aria-label="Profil"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profil</button>
</div></nav>

<div id="overlay" role="dialog" aria-label="Minuteur de repos">
  <div class="ovhead"><span class="eyebrow">Récupération</span><h2 style="margin:3px 0 0;font-size:1.7rem">Repos</h2></div>
  <div class="ring">
    <svg viewBox="0 0 230 230"><circle cx="115" cy="115" r="104" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
      <circle id="ringFg" cx="115" cy="115" r="104" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="653" stroke-dashoffset="0"/></svg>
    <div class="t num" id="ovTxt">1:30</div>
  </div>
  <div class="ovsub muted small" id="ovSub"></div>
  <span id="ovAnnonce" class="sr-only" aria-live="assertive"></span>
  <div class="row" style="justify-content:center">
    <button class="chip" id="ovMinus">−15 SEC</button>
    <button class="chip" id="ovPlus">+15 SEC</button>
  </div>
  <button class="primary big" id="ovSkip" style="max-width:300px">Passer le repos</button>
</div>

<script type="module" src="src/ui/app.js"></script>
<script src="boot.js"></script>
</body>
</html>
