<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080B16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CoachPerso">
<link rel="apple-touch-icon" href="assets/icons/icon.svg">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>Coach Perso IA</title>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">
    <img class="logo" src="assets/icons/icon.svg" alt="">
    <div><div class="eyebrow">Coaching intelligent</div><b>Coach Perso&nbsp;IA</b></div>
  </div>
  <button id="themeBtn" class="chip" aria-label="Changer de thème">◐</button>
</div></header>

<main class="wrap" id="view" role="main"></main>

<nav class="tabs" id="tabs" hidden><div class="wrap">
  <button data-tab="dash" aria-label="Accueil"><span class="ico">🏠</span>Accueil</button>
  <button data-tab="prog" aria-label="Programme"><span class="ico">🗂️</span>Programme</button>
  <button data-tab="train" aria-label="Séance"><span class="ico">🏋️</span>Séance</button>
  <button data-tab="food" aria-label="Nutrition"><span class="ico">🍽️</span>Nutrition</button>
  <button data-tab="stats" aria-label="Progrès"><span class="ico">📈</span>Progrès</button>
  <button data-tab="set" aria-label="Réglages"><span class="ico">⚙️</span>Réglages</button>
</div></nav>

<div id="overlay" role="dialog" aria-label="Minuteur de repos">
  <div class="eyebrow">Repos</div>
  <div class="ring">
    <svg viewBox="0 0 230 230"><circle cx="115" cy="115" r="104" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
      <circle id="ringFg" cx="115" cy="115" r="104" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="653" stroke-dashoffset="0"/></svg>
    <div class="t num" id="ovTxt">1:30</div>
  </div>
  <div class="row">
    <button class="chip" id="ovMinus">−15 s</button>
    <button class="chip" id="ovPlus">+15 s</button>
    <button class="primary" id="ovSkip">Reprendre</button>
  </div>
</div>

<script type="module" src="src/ui/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    var hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (hadController) window.location.reload();
    });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (r) { r.update && r.update(); }).catch(function () {});
    });
  }
</script>
</body>
</html>
