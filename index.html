<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self'; worker-src 'self'; img-src 'self' data: blob: https://raw.githubusercontent.com https://wger.de https://*.cloudfront.net https://oss.exercisedb.dev; media-src 'self' https://raw.githubusercontent.com https://wger.de https://*.cloudfront.net; connect-src 'self' https://world.openfoodfacts.org https://oss.exercisedb.dev https://exercisedb.p.rapidapi.com">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080B16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CoachPerso">
<link rel="apple-touch-icon" href="assets/icons/icon.svg">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://raw.githubusercontent.com">
<link rel="dns-prefetch" href="https://raw.githubusercontent.com">
<link rel="preconnect" href="https://wger.de">
<link rel="dns-prefetch" href="https://wger.de">
<link rel="stylesheet" href="style.css">
<title>Coach Perso IA</title>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">
    <img class="logo" src="assets/icons/icon.svg" alt="">
    <div><div class="eyebrow">Coaching intelligent</div><b>Coach Perso&nbsp;IA</b></div>
  </div>
  <button id="themeBtn" class="chip" aria-label="Changer de thème">◐</button>
</div></header>

<main class="wrap" id="view" role="main"></main>

<nav class="tabs" id="tabs" hidden><div class="wrap">
  <button data-tab="dash" aria-label="Accueil"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Accueil</button>
  <button data-tab="prog" aria-label="Programme"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>Programme</button>
  <button data-tab="train" aria-label="Séance"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8v8M7 6v12M17 6v12M20 8v8M7 12h10"/></svg>Séance</button>
  <button data-tab="food" aria-label="Nutrition"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7.5c-1-1.5-3.2-2-4.6-.7C6 8 6.2 11 7.2 13.4c.8 1.9 1.9 3.1 3.1 3.4.6.1 1-.2 1.7-.2s1.1.3 1.7.2c1.2-.3 2.3-1.5 3.1-3.4 1-2.4 1.2-5.4-.2-6.6-1.4-1.3-3.6-.8-4.6.7z"/><path d="M12 7.5c.1-1.2.9-2.1 2.2-2.4"/></svg>Nutrition</button>
  <button data-tab="stats" aria-label="Progrès"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V4M4 20h16"/><path d="M7 15l3-3 3 2 4-6"/></svg>Progrès</button>
  <button data-tab="set" aria-label="Réglages"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg>Réglages</button>
</div></nav>

<div id="overlay" role="dialog" aria-label="Minuteur de repos">
  <div class="eyebrow">Repos</div>
  <div class="ring">
    <svg viewBox="0 0 230 230"><circle cx="115" cy="115" r="104" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
      <circle id="ringFg" cx="115" cy="115" r="104" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="653" stroke-dashoffset="0"/></svg>
    <div class="t num" id="ovTxt">1:30</div>
  </div>
  <div class="row">
    <button class="chip" id="ovMinus">−15 s</button>
    <button class="chip" id="ovPlus">+15 s</button>
    <button class="primary" id="ovSkip">Reprendre</button>
  </div>
</div>

<script type="module" src="src/ui/app.js"></script>
<script src="boot.js"></script>
</body>
</html>
